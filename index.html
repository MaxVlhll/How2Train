<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How2Train</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏋️</text></svg>">
<style>
  :root {
    --bg: #0c0f14;
    --card: #151a22;
    --card-hi: #1b2230;
    --line: #242d3a;
    --txt: #e8edf5;
    --dim: #8c99ab;
    --force: #f5a524;
    --course: #38bdf8;
    --hybride: #f43f5e;
    --repos: #7c8798;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--txt);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header { padding: 24px 0 20px; }
  h1 {
    margin: 0;
    font-size: 15px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 600;
  }
  .back {
    display: inline-block;
    margin-bottom: 18px;
    padding: 6px 0;
    background: none;
    border: 0;
    color: var(--dim);
    font: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .back:hover { color: var(--txt); }
  .back[hidden] { display: none; }

  .group-name {
    margin: 26px 0 10px;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .pick {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin-bottom: 8px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--txt);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .pick:hover { background: var(--card-hi); }
  .pick-name { font-size: 18px; font-weight: 600; }
  .pick-meta { color: var(--dim); font-size: 14px; }
  .now {
    flex: none;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(245,165,36,.14);
    color: var(--force);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
  }

  .title { margin: 0 0 6px; font-size: 27px; line-height: 1.2; font-weight: 700; }
  .meta { color: var(--dim); font-size: 14px; }
  .focus { margin: 16px 0 28px; color: #c3cdda; }

  details.s {
    margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent, var(--repos));
    border-radius: 12px;
    overflow: hidden;
  }
  details.s[open] { background: var(--card-hi); }
  summary { padding: 14px 18px; cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .day {
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .type { flex: none; font-size: 13px; color: var(--accent, var(--repos)); }
  .s-title { margin-top: 3px; font-size: 17px; font-weight: 600; }
  .detail {
    padding: 14px 18px 16px;
    color: #c3cdda;
    font-size: 15px;
    border-top: 1px solid var(--line);
  }

  .targets { padding: 0 18px 16px; }
  .t-row {
    display: grid;
    grid-template-columns: 1fr 78px 78px;
    gap: 8px;
    padding: 7px 0;
    border-top: 1px solid var(--line);
    font-size: 14px;
  }
  .t-head {
    border-top: 0;
    padding-top: 0;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .t-ex { color: #c3cdda; }
  .t-v { color: var(--txt); font-variant-numeric: tabular-nums; }
  .t-note { margin-top: 10px; color: var(--dim); font-size: 13px; }

  .rules { margin-top: 34px; }
  .rules h2 {
    margin: 0 0 12px;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .rules ul { margin: 0; padding-left: 20px; color: #c3cdda; font-size: 15px; }
  .rules li { margin-bottom: 8px; }

  footer { margin-top: 40px; color: #55606f; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="back" hidden>← tous les trainings</button>
    <h1>How2Train</h1>
  </header>
  <main id="app"></main>
</div>

<script src="data.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var back = document.getElementById('back');
  var KEY = 'how2train.last';

  // Couleur d'accent déduite du type de séance.
  function accent(type) {
    var t = type.toLowerCase();
    if (t.indexOf('hybride') > -1) return 'var(--hybride)';
    if (t.indexOf('muscu') > -1 || t.indexOf('porté') > -1) return 'var(--force)';
    if (t.indexOf('repos') > -1) return 'var(--repos)';
    return 'var(--course)';
  }

  // Phase en cours = aujourd'hui dans [start, end]. Programmes sans dates : jamais.
  function isNow(p) {
    if (!p.start || !p.end) return false;
    var today = new Date().toISOString().slice(0, 10);
    return today >= p.start && today <= p.end;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function dateRange(p) {
    if (!p.start) return '';
    return ' · ' + p.start.split('-').reverse().join('/') + ' → ' + p.end.split('-').reverse().join('/');
  }

  // Repères chiffrés Lui / Elle pour les exercices où la charge ou le temps diffère.
  function targets(rows) {
    var box = el('div', 'targets');
    var head = el('div', 't-row t-head');
    head.appendChild(el('div', 't-ex', 'repères'));
    head.appendChild(el('div', 't-v', 'lui'));
    head.appendChild(el('div', 't-v', 'elle'));
    box.appendChild(head);
    rows.forEach(function (t) {
      var r = el('div', 't-row');
      r.appendChild(el('div', 't-ex', t.ex));
      r.appendChild(el('div', 't-v', t.lui));
      r.appendChild(el('div', 't-v', t.elle));
      box.appendChild(r);
    });
    box.appendChild(el('div', 't-note', 'Points de départ à calibrer : la bonne charge est celle qui laisse 2 répétitions en réserve.'));
    return box;
  }

  function renderCatalogue() {
    document.title = 'How2Train';
    back.hidden = true;
    app.innerHTML = '';
    var groups = [];
    window.PROGRAMS.forEach(function (p) {
      if (groups.indexOf(p.group) === -1) groups.push(p.group);
    });
    groups.forEach(function (g) {
      app.appendChild(el('div', 'group-name', g));
      window.PROGRAMS.filter(function (p) { return p.group === g; }).forEach(function (p) {
        var b = el('button', 'pick');
        var left = el('div');
        left.appendChild(el('div', 'pick-name', p.name));
        left.appendChild(el('div', 'pick-meta', p.meta + dateRange(p)));
        b.appendChild(left);
        if (isNow(p)) b.appendChild(el('span', 'now', 'en cours'));
        b.onclick = function () { go(p.id); };
        app.appendChild(b);
      });
    });
  }

  function renderProgram(p) {
    document.title = p.name + ' — How2Train';
    back.hidden = false;
    app.innerHTML = '';
    app.appendChild(el('h2', 'title', p.name));
    app.appendChild(el('div', 'meta', p.meta + dateRange(p)));
    app.appendChild(el('p', 'focus', p.focus));

    p.sessions.forEach(function (s) {
      var d = el('details', 's');
      d.style.setProperty('--accent', accent(s.type));
      var sum = el('summary');
      var row = el('div', 'row');
      row.appendChild(el('div', 'day', s.day));
      row.appendChild(el('div', 'type', s.type));
      sum.appendChild(row);
      sum.appendChild(el('div', 's-title', s.title));
      d.appendChild(sum);
      d.appendChild(el('div', 'detail', s.detail));
      if (s.targets && s.targets.length) d.appendChild(targets(s.targets));
      app.appendChild(d);
    });

    if (p.rules && p.rules.length) {
      var box = el('section', 'rules');
      box.appendChild(el('h2', null, 'Règles de la phase'));
      var ul = el('ul');
      p.rules.forEach(function (r) { ul.appendChild(el('li', null, r)); });
      box.appendChild(ul);
      app.appendChild(box);
    }

    app.appendChild(el('footer', null, 'Guide, pas planning : une séance manquée ne se rattrape pas.'));
  }

  function find(id) {
    return window.PROGRAMS.filter(function (p) { return p.id === id; })[0];
  }

  function render(id) {
    var p = id && find(id);
    if (p) renderProgram(p); else renderCatalogue();
    window.scrollTo(0, 0);
  }

  function go(id) {
    history.pushState({ id: id }, '', id ? '?p=' + id : location.pathname);
    try {
      if (id) localStorage.setItem(KEY, id); else localStorage.removeItem(KEY);
    } catch (e) {}
    render(id);
  }

  function currentId() {
    return new URLSearchParams(location.search).get('p');
  }

  back.onclick = function () { go(null); };
  window.onpopstate = function () { render(currentId()); };

  var start = currentId();
  if (!start) {
    try { start = localStorage.getItem(KEY); } catch (e) {}
    if (start && find(start)) history.replaceState({ id: start }, '', '?p=' + start);
  }
  render(start);
})();
</script>
</body>
</html>
